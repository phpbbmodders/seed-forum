variables:
  PHPBB_ROOT: /home/william/Desktop/repos/seeded-board/bare
  SERVER_NAME: localhost
  SERVER_PORT: '8093'
  documentation_EXT_SRC: /home/william/Desktop/repos/documentation
  NGINX_SITE: /etc/nginx/sites-available/phpbb-bare.conf
  prosilver_se_revolution_SRC: /home/william/Desktop/repos/prosilver_se_revolution
  ProMinoDeux_SRC: /home/william/Desktop/repos/ProMinoDeux/
board:
  root: ${PHPBB_ROOT}
  server_name: ${SERVER_NAME}
  server_port: ${SERVER_PORT}
  nginx_site: ${NGINX_SITE}
  seeds:
    - bin/seed-standard-fixtures.php
extensions:
  documentation:
    source: ${documentation_EXT_SRC}
    seeds:  []
styles:
  prosilver_se_revolution:
    source: ${prosilver_se_revolution_SRC}
    default: false
  ProMinoDeux:
    source: ${ProMinoDeux_SRC}
    default: true
