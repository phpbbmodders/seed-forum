# Disposable phpBB 3.3 board for teamsecurity: runtime check of the
# failed-login handler when the login form key is invalid (no user_row).
variables:
  PHPBB_ROOT: /home/william/Desktop/repos/seeded-board/teamsecurity-33

  TEAMSECURITY_EXT_SRC: /home/william/Desktop/repos/teamsecurity

  SERVER_NAME: localhost

  # Remove this variable and board.nginx_site to leave nginx unchanged.
  NGINX_SITE: /etc/nginx/sites-available/phpbb-teamsecurity-33.conf

  SERVER_PORT: '8141'

board:
  root: ${PHPBB_ROOT}

  phpbb_branch: '3.3'

  server_name: ${SERVER_NAME}

  server_port: ${SERVER_PORT}

  nginx_site: ${NGINX_SITE}

  seeds:
    - bin/seed-standard-fixtures.php

styles: {}

extensions:
  teamsecurity:
    source: ${TEAMSECURITY_EXT_SRC}
