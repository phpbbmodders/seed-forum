# Disposable phpBB 4.0 (master) board for translationhelper: a test Swedish language
# and the seedforum/translatable fixture extension to translate.
variables:
  PHPBB_ROOT: /home/william/Desktop/repos/seeded-board/translationhelper-40

  TRANSLATIONHELPER_EXT_SRC: /home/william/Desktop/repos/translationhelper

  SERVER_NAME: localhost

  # Remove this variable and board.nginx_site to leave nginx unchanged.
  NGINX_SITE: /etc/nginx/sites-available/phpbb-translationhelper-40.conf

  SERVER_PORT: '8152'

board:
  root: ${PHPBB_ROOT}

  phpbb_branch: 'master'

  server_name: ${SERVER_NAME}

  server_port: ${SERVER_PORT}

  nginx_site: ${NGINX_SITE}

  seeds:
    - bin/seed-standard-fixtures.php

styles: {}

extensions:
  translationhelper:
    source: ${TRANSLATIONHELPER_EXT_SRC}

    # Adds the test language and the fixture extension it translates.
    seeds:
      - bin/seed-translationhelper-fixtures.php
