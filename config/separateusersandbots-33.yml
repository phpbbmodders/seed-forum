# Disposable phpBB 3.3 board for separateusersandbots: checks the CDB 1.1.0
# release (tag v1.1.0, checked out in its own worktree) on the current 3.3.x
variables:
  PHPBB_ROOT: /home/william/Desktop/repos/seeded-board/separateusersandbots-33

  SUAB_EXT_SRC: /home/william/Desktop/repos/separateusersandbots-1.1.0

  SERVER_NAME: localhost

  # Remove this variable and board.nginx_site to leave nginx unchanged.
  NGINX_SITE: /etc/nginx/sites-available/phpbb-separateusersandbots-33.conf

  SERVER_PORT: '8135'

board:
  root: ${PHPBB_ROOT}

  phpbb_branch: '3.3'

  server_name: ${SERVER_NAME}

  server_port: ${SERVER_PORT}

  nginx_site: ${NGINX_SITE}

  seeds:
    - bin/seed-standard-fixtures.php

styles: {}

extensions:
  separateusersandbots:
    source: ${SUAB_EXT_SRC}
